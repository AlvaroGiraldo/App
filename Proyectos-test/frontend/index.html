<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contraste — Verificación de contenido</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main id="contenido">

		<!-- ==========================================================
		 BUSCADOR DE FUENTES — explora el catálogo de referencias
		 ========================================================== -->
	<section id="fuentes" class="fuentes" aria-labelledby="titulo-fuentes">
	  <h2 id="titulo-fuentes">Explorar fuentes de referencia</h2>

	  <p class="fuentes__intro">
		Busca por tema o entidad directamente en medios oficiales,
		verificadores y fuentes especializadas.
	  </p>

	  <form id="form-fuentes" class="barra-busqueda" role="search" aria-label="Buscar en fuentes de referencia">

		<svg class="barra-busqueda__icono" viewBox="0 0 24 24" aria-hidden="true">
		  <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
		  <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
		</svg>

		<label class="visualmente-oculto" for="busqueda-fuentes">Buscar en fuentes de referencia</label>
		<input
		  type="search"
		  id="busqueda-fuentes"
		  name="busqueda-fuentes"
		  class="barra-busqueda__campo"
		  placeholder="Busca un tema, entidad o palabra clave…"
		  autocomplete="off">

		<button type="submit" class="barra-busqueda__boton" aria-label="Buscar">
		  <svg viewBox="0 0 24 24" aria-hidden="true">
			<line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
			<polyline points="12 5 19 12 12 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
		  </svg>
		</button>
	  </form>

	  <div class="chips" role="group" aria-label="Filtrar por tipo de fuente">
		  <button type="button" class="chip is-activo" data-categoria="todas" aria-pressed="true">Todas</button>
		  <button type="button" class="chip" data-categoria="oficial" aria-pressed="false">Oficiales</button>
		  <button type="button" class="chip" data-categoria="verificador" aria-pressed="false">Verificadores</button>
		  <button type="button" class="chip" data-categoria="medio" aria-pressed="false">Medios</button>
		</div>

	  <div id="resultados-fuentes" class="resultados-fuentes" aria-live="polite">
		<p class="estado-vacio">Escribe algo arriba o elige una categoría para explorar las fuentes.</p>
	  </div>
	</section>
	<!-- ==========================================================
     NOTICIAS DEL DÍA
     ========================================================== -->
	<section id="noticias" class="noticias" aria-labelledby="titulo-noticias">
		<h2 id="titulo-noticias">Lo que pasa hoy</h2>

		<p class="noticias__intro">
			Colombia y el mundo, con la cobertura de cada tipo de fuente a la vista.
		</p>

		<div class="tabs-ambito" role="group" aria-label="Filtrar por ámbito">
			<button type="button" class="tab-ambito is-activo" data-ambito="todos" aria-pressed="true">Todo</button>
			<button type="button" class="tab-ambito" data-ambito="Colombia" aria-pressed="false">Colombia</button>
			<button type="button" class="tab-ambito" data-ambito="Mundial" aria-pressed="false">Mundial</button>
		</div>

		<div id="lista-noticias" class="lista-noticias" aria-live="polite">
			<!-- Las tarjetas de noticias se dibujan aquí desde app.js -->
		</div>
	</section>

  </main>
  <!-- Ventana emergente del detalle de una noticia. app.js la llena y la abre. REVISAR IMPORTANTE!!!--> 
  <dialog id="detalle-noticia" class="modal" aria-labelledby="modal-titulo">
    <div class="modal__barra">
      <button type="button" class="modal__cerrar" id="modal-cerrar" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div id="modal-contenido" class="modal__contenido"></div>
  </dialog>
  <script src="js/app.js" type="module"></script>
</body>
</html>
